<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="960" height="540" fill="#1a1a2e"/>

  <!-- Left Toolbar -->
  <rect x="0" y="0" width="56" height="540" fill="#16213e"/>
  <line x1="56" y1="0" x2="56" y2="540" stroke="#0f3460" stroke-width="1"/>

  <!-- Tool buttons -->
  <!-- Select (active) -->
  <rect x="8" y="8" width="40" height="40" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <path d="M20 16l5.3 12.7 1.9-5.5 5.5-1.9L20 16z" fill="none" stroke="#e94560" stroke-width="1.5"/>

  <!-- Rectangle -->
  <rect x="8" y="52" width="40" height="40" rx="6" fill="transparent" stroke="transparent"/>
  <rect x="18" y="62" width="20" height="20" rx="2" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>

  <!-- Ellipse -->
  <rect x="8" y="96" width="40" height="40" rx="6" fill="transparent"/>
  <ellipse cx="28" cy="116" rx="10" ry="10" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>

  <!-- Arrow -->
  <rect x="8" y="140" width="40" height="40" rx="6" fill="transparent"/>
  <line x1="18" y1="170" x2="38" y2="150" stroke="#a0a0b8" stroke-width="1.5"/>
  <polyline points="33,150 38,150 38,155" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>

  <!-- Freehand -->
  <rect x="8" y="184" width="40" height="40" rx="6" fill="transparent"/>
  <path d="M18 208c3-4 6 2 9-1s3-6 6-4" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>

  <!-- Text -->
  <rect x="8" y="228" width="40" height="40" rx="6" fill="transparent"/>
  <text x="28" y="254" text-anchor="middle" fill="#a0a0b8" font-size="16" font-weight="bold">T</text>

  <!-- Image -->
  <rect x="8" y="272" width="40" height="40" rx="6" fill="transparent"/>
  <rect x="18" y="282" width="20" height="20" rx="2" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>
  <circle cx="23" cy="287" r="2" fill="#a0a0b8"/>
  <path d="M38 296l-6-6-14 14" fill="none" stroke="#a0a0b8" stroke-width="1"/>

  <!-- Separator -->
  <line x1="12" y1="320" x2="44" y2="320" stroke="#0f3460" stroke-width="1"/>

  <!-- Undo -->
  <rect x="8" y="328" width="40" height="40" rx="6" fill="transparent"/>
  <path d="M22 344a7 7 0 1 0 1.5-6.7L18 342" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>
  <polyline points="18,337 18,342 23,342" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>

  <!-- Redo -->
  <rect x="8" y="372" width="40" height="40" rx="6" fill="transparent"/>
  <path d="M34 388a7 7 0 1 1-1.5-6.7L38 386" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>
  <polyline points="38,381 38,386 33,386" fill="none" stroke="#a0a0b8" stroke-width="1.5"/>

  <!-- Grid -->
  <rect x="8" y="416" width="40" height="40" rx="6" fill="transparent"/>
  <rect x="18" y="426" width="8" height="8" fill="none" stroke="#a0a0b8" stroke-width="1"/>
  <rect x="30" y="426" width="8" height="8" fill="none" stroke="#a0a0b8" stroke-width="1"/>
  <rect x="18" y="438" width="8" height="8" fill="none" stroke="#a0a0b8" stroke-width="1"/>
  <rect x="30" y="438" width="8" height="8" fill="none" stroke="#a0a0b8" stroke-width="1"/>

  <!-- Separator -->
  <line x1="12" y1="464" x2="44" y2="464" stroke="#0f3460" stroke-width="1"/>

  <!-- Export buttons -->
  <rect x="8" y="472" width="40" height="24" rx="6" fill="transparent"/>
  <text x="28" y="488" text-anchor="middle" fill="#a0a0b8" font-size="10" font-weight="600">PNG</text>
  <rect x="8" y="500" width="40" height="24" rx="6" fill="transparent"/>
  <text x="28" y="516" text-anchor="middle" fill="#a0a0b8" font-size="10" font-weight="600">SVG</text>

  <!-- Canvas content - sample diagram -->
  <!-- Architecture boxes -->
  <rect x="120" y="80" width="160" height="70" rx="8" fill="rgba(74,158,255,0.15)" stroke="#4a9eff" stroke-width="2"/>
  <text x="200" y="110" text-anchor="middle" fill="#e0e0f0" font-size="14" font-weight="600">Browser Canvas</text>
  <text x="200" y="130" text-anchor="middle" fill="#a0a0b8" font-size="11">Fabric.js 6.5.1</text>

  <rect x="400" y="80" width="160" height="70" rx="8" fill="rgba(74,158,255,0.15)" stroke="#4a9eff" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" fill="#e0e0f0" font-size="14" font-weight="600">Node.js Server</text>
  <text x="480" y="130" text-anchor="middle" fill="#a0a0b8" font-size="11">HTTP + WS + API</text>

  <rect x="680" y="80" width="160" height="70" rx="8" fill="rgba(74,158,255,0.15)" stroke="#4a9eff" stroke-width="2"/>
  <text x="760" y="110" text-anchor="middle" fill="#e0e0f0" font-size="14" font-weight="600">Claude Code</text>
  <text x="760" y="130" text-anchor="middle" fill="#a0a0b8" font-size="11">Skills + Hooks</text>

  <!-- Arrows between boxes -->
  <line x1="280" y1="105" x2="395" y2="105" stroke="#4a9eff" stroke-width="2"/>
  <polygon points="395,105 385,100 385,110" fill="#4a9eff"/>
  <text x="338" y="98" text-anchor="middle" fill="#50c878" font-size="9">WebSocket</text>

  <line x1="560" y1="105" x2="675" y2="105" stroke="#4a9eff" stroke-width="2"/>
  <polygon points="675,105 665,100 665,110" fill="#4a9eff"/>
  <text x="618" y="98" text-anchor="middle" fill="#50c878" font-size="9">PNG + JSON</text>

  <!-- Bidirectional arrow (push API) -->
  <line x1="395" y1="125" x2="280" y2="125" stroke="#e94560" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="280,125 290,120 290,130" fill="#e94560"/>
  <text x="338" y="140" text-anchor="middle" fill="#e94560" font-size="9">POST /api/canvas</text>

  <!-- Sample freehand drawing -->
  <path d="M150 240 C170 220, 200 260, 230 230 S280 250, 300 220" fill="none" stroke="#4a9eff" stroke-width="3" stroke-linecap="round"/>

  <!-- Sample rectangle with selection handles -->
  <rect x="380" y="210" width="180" height="120" rx="4" fill="rgba(233,69,96,0.1)" stroke="#e94560" stroke-width="2"/>
  <text x="470" y="260" text-anchor="middle" fill="#e0e0f0" font-size="13">Annotated Region</text>
  <text x="470" y="280" text-anchor="middle" fill="#a0a0b8" font-size="11">with properties panel</text>
  <!-- Selection handles -->
  <rect x="376" y="206" width="8" height="8" fill="#fff" stroke="#4a9eff" stroke-width="1"/>
  <rect x="466" y="206" width="8" height="8" fill="#fff" stroke="#4a9eff" stroke-width="1"/>
  <rect x="556" y="206" width="8" height="8" fill="#fff" stroke="#4a9eff" stroke-width="1"/>
  <rect x="376" y="326" width="8" height="8" fill="#fff" stroke="#4a9eff" stroke-width="1"/>
  <rect x="556" y="326" width="8" height="8" fill="#fff" stroke="#4a9eff" stroke-width="1"/>

  <!-- Sample arrow -->
  <line x1="620" y1="280" x2="780" y2="220" stroke="#e0e0f0" stroke-width="2"/>
  <polygon points="780,220 768,220 774,230" fill="#e0e0f0"/>

  <!-- Sample text -->
  <text x="650" y="310" fill="#e0e0f0" font-size="14">API endpoint</text>

  <!-- Pasted image placeholder -->
  <rect x="130" y="330" width="160" height="100" rx="4" fill="#2a2a4e" stroke="#4a9eff" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="210" y="375" text-anchor="middle" fill="#a0a0b8" font-size="11">Pasted Screenshot</text>
  <text x="210" y="395" text-anchor="middle" fill="#606080" font-size="10">(Ctrl+V to paste)</text>

  <!-- Properties Panel (floating, top-right) -->
  <rect x="770" y="170" width="170" height="220" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="1"/>
  <text x="786" y="192" fill="#e0e0f0" font-size="12" font-weight="600">Properties</text>

  <text x="786" y="212" fill="#a0a0b8" font-size="10">Fill</text>
  <rect x="786" y="216" width="138" height="18" rx="3" fill="#e94560" opacity="0.3" stroke="#0f3460" stroke-width="1"/>

  <text x="786" y="248" fill="#a0a0b8" font-size="10">Stroke</text>
  <rect x="786" y="252" width="138" height="18" rx="3" fill="#e94560" stroke="#0f3460" stroke-width="1"/>

  <text x="786" y="284" fill="#a0a0b8" font-size="10">Stroke Width</text>
  <rect x="786" y="288" width="138" height="6" rx="3" fill="#0f3460"/>
  <circle cx="830" cy="291" r="5" fill="#4a9eff"/>

  <text x="786" y="312" fill="#a0a0b8" font-size="10">Opacity</text>
  <rect x="786" y="316" width="138" height="6" rx="3" fill="#0f3460"/>
  <circle cx="910" cy="319" r="5" fill="#4a9eff"/>

  <!-- Property action buttons -->
  <rect x="786" y="340" width="32" height="22" rx="4" fill="#0f3460" stroke="#1a3a6e" stroke-width="1"/>
  <text x="802" y="355" text-anchor="middle" fill="#a0a0b8" font-size="9">Del</text>
  <rect x="822" y="340" width="32" height="22" rx="4" fill="#0f3460" stroke="#1a3a6e" stroke-width="1"/>
  <text x="838" y="355" text-anchor="middle" fill="#a0a0b8" font-size="9">Dup</text>
  <rect x="858" y="340" width="24" height="22" rx="4" fill="#0f3460" stroke="#1a3a6e" stroke-width="1"/>
  <text x="870" y="355" text-anchor="middle" fill="#a0a0b8" font-size="9">\u2191</text>
  <rect x="886" y="340" width="24" height="22" rx="4" fill="#0f3460" stroke="#1a3a6e" stroke-width="1"/>
  <text x="898" y="355" text-anchor="middle" fill="#a0a0b8" font-size="9">\u2193</text>

  <!-- Bottom Bar -->
  <rect x="56" y="492" width="904" height="48" fill="#16213e"/>
  <line x1="56" y1="492" x2="960" y2="492" stroke="#0f3460" stroke-width="1"/>

  <!-- Connection status -->
  <circle cx="76" cy="516" r="4" fill="#50c878"/>
  <text x="86" y="520" fill="#e0e0f0" font-size="12">Connected</text>

  <!-- Zoom indicator -->
  <text x="168" y="520" fill="#a0a0b8" font-size="12" font-family="monospace">100%</text>

  <!-- Prompt input -->
  <rect x="205" y="500" width="560" height="32" rx="6" fill="#1a1a2e" stroke="#0f3460" stroke-width="1"/>
  <text x="218" y="520" fill="#606080" font-size="13">Add a message (optional)...</text>

  <!-- Submit button -->
  <rect x="775" y="500" width="160" height="32" rx="6" fill="#e94560"/>
  <text x="855" y="521" text-anchor="middle" fill="white" font-size="13" font-weight="600">Submit to Claude</text>
</svg>